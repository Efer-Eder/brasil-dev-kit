# API pública do Brasil Dev Kit na VPS (ver docs/api.md e docs/deploy.md).
# Publicada só no loopback: o acesso externo passa pelo Nginx.
name: brasil-dev-kit

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: brasil-dev-kit-api:latest
    container_name: brasil-dev-kit-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8795:8795"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8795"
    # Isolamento: sistema de arquivos só leitura, sem capabilities, sem escalada.
    read_only: true
    tmpfs:
      - /tmp:size=8m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Limites (justificativa em docs/api.md, seção "Capacidade").
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 15m
        max-file: "3"
