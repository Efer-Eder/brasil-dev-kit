# Contexto server de efer.online (instalado em /etc/nginx/snippets/brasil-dev-kit.conf
# e incluído no server block). Rota pública: https://efer.online/api/brasil-dev-kit/

location = /api/brasil-dev-kit {
    return 301 /api/brasil-dev-kit/;
}

location ^~ /api/brasil-dev-kit/ {
    # Limites por visitante: 10 req/s sustentadas, rajada de 30, 20 conexões.
    limit_req zone=bdk_per_ip burst=30 nodelay;
    limit_req_status 429;
    limit_conn bdk_conn_per_ip 20;
    limit_conn_status 429;

    # A API só aceita GET/HEAD/OPTIONS sem corpo.
    client_max_body_size 1k;

    # Respostas JSON para erros gerados pelo próprio Nginx (limite, app fora do ar).
    error_page 429 = @bdk_rate_limited;
    error_page 502 503 504 = @bdk_unavailable;

    proxy_pass http://bdk_api/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $bdk_client_ip;
    proxy_connect_timeout 2s;
    proxy_send_timeout 10s;
    # A API responde em até ~8 s no pior caso (2 provedores × 4 s).
    proxy_read_timeout 12s;
    proxy_buffering on;
}

location @bdk_rate_limited {
    default_type application/json;
    add_header Retry-After 1 always;
    add_header Access-Control-Allow-Origin * always;
    add_header Cache-Control no-store always;
    return 429 '{"erro":{"codigo":"RATE_LIMIT","mensagem":"Limite de 10 requisições por segundo por IP excedido. Tente de novo em instantes."}}';
}

location @bdk_unavailable {
    default_type application/json;
    add_header Retry-After 30 always;
    add_header Access-Control-Allow-Origin * always;
    add_header Cache-Control no-store always;
    return 503 '{"erro":{"codigo":"SERVICE_UNAVAILABLE","mensagem":"API temporariamente indisponível."}}';
}
