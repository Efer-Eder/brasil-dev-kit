# Contexto http do Nginx (instalado em /etc/nginx/conf.d/brasil-dev-kit.conf).
# Tudo prefixado com "bdk_" para não colidir com outros projetos da VPS.

# IP real do visitante: o site fica atrás do Cloudflare, então $remote_addr é o
# IP do Cloudflare. Só confiamos em CF-Connecting-IP quando a conexão vem de uma
# faixa oficial do Cloudflare (https://www.cloudflare.com/ips/, lida em 20/11/2026);
# fora delas, o cabeçalho é ignorado para não permitir falsificação.
geo $bdk_from_cloudflare {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

map $bdk_from_cloudflare $bdk_cf_ip {
    1 $http_cf_connecting_ip;
    default "";
}

map $bdk_cf_ip $bdk_client_ip {
    "" $remote_addr;
    default $bdk_cf_ip;
}

# 10 req/s por IP (rajada definida na location). 10 MB guardam ~160 mil IPs.
limit_req_zone $bdk_client_ip zone=bdk_per_ip:10m rate=10r/s;
limit_conn_zone $bdk_client_ip zone=bdk_conn_per_ip:10m;

upstream bdk_api {
    server 127.0.0.1:8795;
    keepalive 16;
    # Menor que o keepAliveTimeout do Node (5 s) para o Nginx nunca reutilizar
    # uma conexão que o Node acabou de fechar.
    keepalive_timeout 4s;
}
