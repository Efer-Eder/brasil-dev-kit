name: Integration (APIs reais)

# Separado do CI obrigatório: falhas aqui indicam mudança de contrato ou
# indisponibilidade dos provedores, e não bloqueiam pull requests.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1" # segundas, 06:00 em Brasília

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:integration
